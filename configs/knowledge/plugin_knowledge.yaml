plugin_knowledge:
  categories:
    eq:
      name: eq
      family: tone
      typical_use: frequency balance and tonal correction
      safe_order: 1
      parameter_order: [frequency, gain, q]
    compressor:
      name: compressor
      family: dynamics
      typical_use: control dynamics and add sustain
      safe_order: 2
      parameter_order: [threshold, ratio, attack, release, makeup_gain]
    limiter:
      name: limiter
      family: dynamics
      typical_use: final loudness and peak protection
      safe_order: 6
      parameter_order: [ceiling, release, lookahead]
    imager:
      name: imager
      family: stereo
      typical_use: stereo width and mono compatibility
      safe_order: 3
      parameter_order: [width, mono_below_hz]
    transient_shaper:
      name: transient_shaper
      family: dynamics
      typical_use: attack and sustain control
      safe_order: 4
      parameter_order: [attack, sustain]
    saturation:
      name: saturation
      family: tone
      typical_use: harmonic warmth and color
      safe_order: 5
      parameter_order: [drive, mix]
    utility:
      name: utility
      family: utility
      typical_use: gain, phase, and utility operations
      safe_order: 7
      parameter_order: []

  parameter_defaults:
    eq:
      frequency:
        range_min: 20.0
        range_max: 20000.0
        default: 3000.0
        unit: Hz
      gain:
        range_min: -24.0
        range_max: 24.0
        default: -2.0
        unit: dB
      q:
        range_min: 0.1
        range_max: 10.0
        default: 1.4
    compressor:
      threshold:
        range_min: -60.0
        range_max: 0.0
        default: -18.0
        unit: dB
      ratio:
        range_min: 1.0
        range_max: 20.0
        default: 3.0
      attack:
        range_min: 0.01
        range_max: 1000.0
        default: 10.0
        unit: ms
      release:
        range_min: 1.0
        range_max: 5000.0
        default: 100.0
        unit: ms
      makeup_gain:
        range_min: 0.0
        range_max: 24.0
        default: 0.0
        unit: dB
    limiter:
      ceiling:
        range_min: -3.0
        range_max: -0.1
        default: -1.0
        unit: dB
      release:
        range_min: 1.0
        range_max: 5000.0
        default: 50.0
        unit: ms
      lookahead:
        range_min: 0.0
        range_max: 20.0
        default: 5.0
        unit: ms
    imager:
      width:
        range_min: 0.0
        range_max: 200.0
        default: 125.0
        unit: "%"
      mono_below_hz:
        range_min: 20.0
        range_max: 500.0
        default: 120.0
        unit: Hz
    transient_shaper:
      attack:
        range_min: -100.0
        range_max: 100.0
        default: 20.0
        unit: "%"
      sustain:
        range_min: -100.0
        range_max: 100.0
        default: -10.0
        unit: "%"
    saturation:
      drive:
        range_min: 0.0
        range_max: 100.0
        default: 15.0
        unit: "%"
      mix:
        range_min: 0.0
        range_max: 100.0
        default: 25.0
        unit: "%"

  target_to_category:
    frequency_balance: eq
    loudness: limiter
    dynamics: compressor
    stereo_image: imager
    transients: transient_shaper
    tonal_balance: eq
    warmth: saturation

  category_to_plugin_type:
    eq: EQ
    compressor: Compressor
    limiter: Limiter
    imager: Imager
    transient_shaper: Transient Shaper
    saturation: Saturation
    utility: Utility

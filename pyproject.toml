[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundbrain"
version = "0.3.0"
description = "AI-powered modular audio intelligence platform."
readme = "docs/README_v2.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Hamid Haddadi" }
]

keywords = [
    "audio",
    "ai",
    "music",
    "machine-learning",
    "llm",
    "rag",
    "embedding",
    "analysis",
    "reference",
    "soundbrain"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true